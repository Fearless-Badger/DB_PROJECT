<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activate Your Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Ample+Display&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Ample Display', sans-serif;
            background-color: #19193b;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }           

        html {
            overflow-y: auto; /* Ensures vertical scrolling is always available */
        }


        .form-container {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 2rem;
            width: 400px;
            box-shadow: 0 2px 8px rgba(63, 69, 81, 0.16);
        }

        
        h2 {
            text-align: center;
            color: #000000;
            margin-bottom: 20px;
        }

        
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            font-weight: bold;
            color: #555;
            margin-bottom: 0.5rem;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="email"],
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            margin-bottom: 15px;
        }

        
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 1em;
        }

        button[type="submit"]:hover {
            background-color: #585656f8;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Add Employee</h2>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <ul class="flashes">
            {% for message in messages %}
                <h4>{{ message }}</h4>
            {% endfor %}
        </ul>
    {% endif %}
    {% endwith %}

    <form action="/add_employee" method="post">
        <div class="form-group">
            <label for="employee_id">Employee ID:</label>
            <input type="number" id="employee_id" name="employee_id" required>
        </div>

        <div class="form-group">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" required>
        </div>

        <div class="form-group">
            <label for="middle_initial">Middle Initial:</label>
            <input type="text" id="middle_initial" name="middle_initial" maxlength="1">
        </div>

        <div class="form-group">
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" required>
        </div>

        <div class="form-group">
            <label for="role">Role:</label>
            <select id="role" name="role">
                <option value="worker">Participant</option>
                <option value="secretary">Secretary</option>
                <option value="coordinator">Wellness Coordinator</option>
            </select>
        </div>

        <div class="form-group" id="coordinator_fields" style="display: none;">
            <label for="area_of_expertise">Area of Expertise:</label>
            <input type="text" id="area_of_expertise" name="area_of_expertise">

            <label for="coordinator_credentials">Coordinator Credentials:</label>
            <input type="text" id="coordinator_credentials" name="coordinator_credentials">
        </div>

        <div class="form-group">
            <label for="phone_number">Phone Number:</label>
            <input type="text" id="phone_number" name="phone_number" required>
        </div>

        <div class="form-group">
            <label for="department_id">Department:</label>
            <select id="department_id" name="department_id">
                <option value="sales">Sales</option>
                <option value="marketing">Marketing</option>
                <option value="finance">Finance</option>
                <option value="operations">Operations</option>
            </select>
        </div>

        <div class="form-group">
            <label for="work_email">Work Email:</label>
            <input type="email" id="work_email" name="work_email" required>
        </div>

        <div class="form-group">
            <button type="submit">Add Employee</button>
        </div>
    </form>
</div>

<script>
    document.getElementById("role").addEventListener("change", function() {
        const coordinatorFields = document.getElementById("coordinator_fields");
        coordinatorFields.style.display = this.value === "coordinator" ? "block" : "none";
    });
</script>

</body>
</html>
