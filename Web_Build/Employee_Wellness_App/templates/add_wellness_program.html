{% extends "base.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Wellness Program</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #19193b;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Form Container */
        .form-container {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 20px;
        }

        /* Header Styling */
        .form-container h1 {
            text-align: center;
            color: #444;
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        /* Fieldset Styling */
        fieldset {
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            padding: 20px;
        }

        fieldset legend {
            font-weight: bold;
            color: #666;
            padding: 0 10px;
            font-size: 1.1em;
        }

        /* Label and Input Styling */
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            margin-bottom: 15px;
        }

        /* Button Styling */
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            background-color: #000000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #585656f8;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }

            .form-container h1 {
                font-size: 1.6em;
            }

            label, input, select, button {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <ul class="flashes">
            {% for message in messages %}
                <h4>{{ message }}</h4>
            {% endfor %}
        </ul>
    {% endif %}
    {% endwith %}
    <div class="form-container">
        <h1>Add Wellness Program</h1>
        <form action="/add_wellness_program" method="post">
            <!-- Program Details -->
            <fieldset>
                <legend>Program Details</legend>

                <label for="program_name">Program Name:</label>
                <input type="text" id="program_name" name="program_name" required placeholder="e.g., Fitness Challenge">

                <label for="program_type">Type of Program:</label>
                <select id="program_type" name="program_type" required>
                    <option value="" disabled selected>Select a type</option>
                    <option value="bmi">BMI Reduction Program</option>
                    <option value="blood_pressure">Blood Pressure Monitoring</option>
                    <option value="heart_rate">Heart Rate Control</option>
                    <option value="cholesterol">Cholesterol Management</option>
                    <option value="mental_health">Mental Health Session</option>
                    <option value="nutrition">Nutrition Program</option>
                    <option value="fitness">Fitness Challenge</option>
                    <option value="other">Other</option>
                </select>

                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" required>

                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" required>
            </fieldset>

            <!-- Coordinator Details -->
            <fieldset>
                <legend>Authorization Details</legend>

                <label for="coordinator_id">Coordinator ID:</label>
                <input type="number" id="coordinator_id" name="coordinator_id" required placeholder="e.g., 103">

                <label for="expertise">Program ID:</label>
                <input type="text" id="expertise" name="expertise" required placeholder="e.g., Fitness, Nutrition">

            </fieldset>

            <!-- Submit Button -->
            <button type="submit">Add Program</button>
        </form>
    </div>
</body>
</html>
